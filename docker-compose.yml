services:
  postgres:
    image: postgres:17
    container_name: rag-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: rag_platform
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rag-api:
    build: .
    container_name: rag-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://rag_user:${POSTGRES_PASSWORD}@postgres:5432/rag_platform
      DOCUMENT_STORAGE_DIR: /app/data/uploads
    volumes:
      - chroma-data:/app/chroma_db
      - huggingface-cache:/home/app/.cache/huggingface
      - document-uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
    name: production-ai-platform-postgres-data

  chroma-data:
    name: production-ai-platform-chroma-data

  huggingface-cache:
    name: production-ai-platform-huggingface-cache

  document-uploads:
    name: production-ai-platform-document-uploads
