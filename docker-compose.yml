services:
  rag-api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma-data:/app/chroma_db
      - huggingface-cache:/home/app/.cache/huggingface
    restart: unless-stopped

volumes:
  chroma-data:
    name: production-ai-platform-chroma-data

  huggingface-cache:
    name: production-ai-platform-huggingface-cache
