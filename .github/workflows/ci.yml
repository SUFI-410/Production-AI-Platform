name: CI / Build & Deploy

on:
  push:
    branches: [ main, develop ]   
  pull_request:
    branches: [ main ]             

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: ruff check . --select E,F,W

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: production-ai-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sanity check
        run: |
          docker run --rm production-ai-platform:latest python -c "from api.main import app; print('✅ App loads')"

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    # ⚠️ Deploy ONLY when the push is to main (not develop)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_IP }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            cd /opt/production-ai-platform
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker image prune -f
