name: CI / Build & Deploy

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check . --select E,F,W

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: production-ai-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container
        run: |
          docker run --rm production-ai-platform:latest python -c "from api.main import app; print('✅ FastAPI application loaded successfully')"

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: docker-build

    # Deploy ONLY when pushing to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_IP }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            cd ~/Production-AI-Platform

            echo "Pulling latest code..."
            git pull origin main

            echo "Building and starting containers..."
            docker compose up -d --build --remove-orphans

            echo "Removing unused Docker images..."
            docker image prune -f

            echo "Deployment completed successfully!"
