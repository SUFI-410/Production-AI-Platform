name: CI / Build & Deploy

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check . --select E,F,W

  test:
    name: Run Automated Tests and Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rag_platform
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OPENAI_API_KEY: test-openai-key
      DATABASE_URL: postgresql+psycopg://rag_user:test_password@127.0.0.1:5432/rag_platform
      JWT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DOCUMENT_STORAGE_DIR: /tmp/production-ai-platform-test-uploads

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Application and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt
          python -m pip install pytest==8.4.2 pytest-asyncio==1.2.0

      - name: Validate and Apply Database Migrations
        run: |
          python -m alembic heads
          python -m alembic upgrade head
          python -m alembic current

      - name: Run Test Suite
        run: |
          python -m pytest -q

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: production-ai-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container
        run: |
          docker run --rm \
            -e OPENAI_API_KEY=test-openai-key \
            -e DATABASE_URL=postgresql+psycopg://rag_user:test_password@localhost:5432/rag_platform \
            -e JWT_SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e DOCUMENT_STORAGE_DIR=/app/data/uploads \
            production-ai-platform:latest \
            python -c "from api.main import app; print('FastAPI application loaded successfully')"

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_IP }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            set -euo pipefail

            cd ~/Production-AI-Platform

            echo "Validating deployment configuration..."

            if [ ! -f .env ]; then
              echo "Deployment aborted: .env was not found."
              exit 1
            fi

            for required_key in \
              POSTGRES_PASSWORD \
              OPENAI_API_KEY \
              JWT_SECRET_KEY \
              TURNSTILE_SECRET
            do
              if ! grep -Eq "^${required_key}=.+$" .env; then
                echo "Deployment aborted: ${required_key} is missing or empty in .env."
                exit 1
              fi
            done

            echo "Pulling latest main branch..."
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            docker compose config --quiet

            umask 077

            backup_directory="$HOME/Production-AI-Platform-backups"
            mkdir -p "$backup_directory"
            chmod 700 "$backup_directory"

            echo "Starting PostgreSQL..."
            docker compose up -d postgres

            database_ready=false

            for attempt in $(seq 1 30)
            do
              if docker compose exec -T postgres \
                pg_isready -U rag_user -d rag_platform
              then
                database_ready=true
                break
              fi

              sleep 2
            done

            if [ "$database_ready" != "true" ]; then
              echo "Deployment aborted: PostgreSQL did not become ready."
              exit 1
            fi

            backup_path="${backup_directory}/pre-migration-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"

            echo "Creating pre-migration database backup..."
            docker compose exec -T postgres \
              pg_dump -U rag_user -d rag_platform |
              gzip > "$backup_path"

            chmod 600 "$backup_path"

            if [ ! -s "$backup_path" ]; then
              echo "Deployment aborted: database backup is empty."
              exit 1
            fi

            backup_permissions="$(stat -c '%a' "$backup_path")"

            if [ "$backup_permissions" != "600" ]; then
              echo "Deployment aborted: backup permissions must be 600."
              exit 1
            fi

            echo "Building the API image..."
            docker compose build rag-api

            echo "Applying database migrations..."
            docker compose run --rm rag-api \
              python -m alembic upgrade head

            echo "Starting the API..."
            docker compose up -d rag-api --remove-orphans

            api_ready=false

            for attempt in $(seq 1 30)
            do
              if curl --fail --silent --show-error \
                http://127.0.0.1:8000/health > /dev/null
              then
                api_ready=true
                break
              fi

              sleep 2
            done

            if [ "$api_ready" != "true" ]; then
              echo "Deployment failed: API health check did not pass."
              docker compose logs --tail=100 rag-api
              exit 1
            fi

            echo "Deployment is healthy."
            docker compose ps

            echo "Removing unused Docker images..."
            docker image prune -f

            echo "Deployment completed successfully."
